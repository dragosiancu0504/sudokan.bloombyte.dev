<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Opening Sudokan...</title>
    
    <!-- App Store Smart Banner for iOS -->
    <meta name="apple-itunes-app" content="app-id=6755333569, app-argument=https://sudokan.bloombyte.dev${window.location.pathname}">
    
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, sans-serif;
            background: linear-gradient(135deg, #1a1a2e 0%, #16213e 100%);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            color: white;
            padding: 20px;
        }
        
        .container {
            text-align: center;
            max-width: 400px;
        }
        
        .logo {
            width: 120px;
            height: 120px;
            margin-bottom: 24px;
            border-radius: 24px;
            box-shadow: 0 8px 32px rgba(0, 0, 0, 0.3);
        }
        
        h1 {
            font-size: 28px;
            margin-bottom: 12px;
            font-weight: 700;
        }
        
        .subtitle {
            font-size: 16px;
            opacity: 0.8;
            margin-bottom: 32px;
        }
        
        .spinner {
            width: 40px;
            height: 40px;
            border: 3px solid rgba(255, 255, 255, 0.3);
            border-top-color: #D97706;
            border-radius: 50%;
            animation: spin 1s linear infinite;
            margin: 0 auto 24px;
        }
        
        @keyframes spin {
            to { transform: rotate(360deg); }
        }
        
        .status {
            font-size: 14px;
            opacity: 0.7;
            margin-bottom: 32px;
        }
        
        .store-buttons {
            display: flex;
            flex-direction: column;
            gap: 12px;
            margin-top: 24px;
        }
        
        .store-button {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 12px;
            background: rgba(255, 255, 255, 0.1);
            border: 1px solid rgba(255, 255, 255, 0.2);
            border-radius: 12px;
            padding: 14px 24px;
            color: white;
            text-decoration: none;
            font-weight: 600;
            transition: all 0.2s;
        }
        
        .store-button:hover {
            background: rgba(255, 255, 255, 0.2);
            transform: translateY(-2px);
        }
        
        .store-button img {
            width: 24px;
            height: 24px;
        }
        
        .hidden {
            display: none;
        }
    </style>
</head>
<body>
    <div class="container">
        <!-- Replace with your app icon -->
        <img src="/assets/app-icon.png" alt="Sudokan" class="logo" onerror="this.style.display='none'">
        
        <h1>🧩 Sudokan</h1>
        <p class="subtitle">Smart Sudoku Challenge</p>
        
        <div id="loading">
            <div class="spinner"></div>
            <p class="status">Opening app...</p>
        </div>
        
        <div id="store-redirect" class="hidden">
            <p class="status">App not installed? Get it here:</p>
            <div class="store-buttons">
                <a href="https://apps.apple.com/app/id6755333569" class="store-button" id="ios-button">
                    <svg width="24" height="24" viewBox="0 0 24 24" fill="currentColor">
                        <path d="M18.71 19.5c-.83 1.24-1.71 2.45-3.05 2.47-1.34.03-1.77-.79-3.29-.79-1.53 0-2 .77-3.27.82-1.31.05-2.3-1.32-3.14-2.53C4.25 17 2.94 12.45 4.7 9.39c.87-1.52 2.43-2.48 4.12-2.51 1.28-.02 2.5.87 3.29.87.78 0 2.26-1.07 3.81-.91.65.03 2.47.26 3.64 1.98-.09.06-2.17 1.28-2.15 3.81.03 3.02 2.65 4.03 2.68 4.04-.03.07-.42 1.44-1.38 2.83M13 3.5c.73-.83 1.94-1.46 2.94-1.5.13 1.17-.34 2.35-1.04 3.19-.69.85-1.83 1.51-2.95 1.42-.15-1.15.41-2.35 1.05-3.11z"/>
                    </svg>
                    Download on App Store
                </a>
                <a href="https://play.google.com/store/apps/details?id=dev.bloombyte.sudokan" class="store-button" id="android-button">
                    <svg width="24" height="24" viewBox="0 0 24 24" fill="currentColor">
                        <path d="M3,20.5V3.5C3,2.91 3.34,2.39 3.84,2.15L13.69,12L3.84,21.85C3.34,21.6 3,21.09 3,20.5M16.81,15.12L6.05,21.34L14.54,12.85L16.81,15.12M20.16,10.81C20.5,11.08 20.75,11.5 20.75,12C20.75,12.5 20.5,12.92 20.16,13.19L17.89,14.5L15.39,12L17.89,9.5L20.16,10.81M6.05,2.66L16.81,8.88L14.54,11.15L6.05,2.66Z"/>
                    </svg>
                    Get it on Google Play
                </a>
            </div>
        </div>
    </div>

    <script>
        (function() {
            // Get the current path (e.g., /c/abc123)
            const path = window.location.pathname + window.location.search;
            
            // Detect platform
            const isIOS = /iPad|iPhone|iPod/.test(navigator.userAgent);
            const isAndroid = /Android/.test(navigator.userAgent);
            
            // App Store / Play Store URLs
            const appStoreUrl = 'https://apps.apple.com/app/id6755333569';
            const playStoreUrl = 'https://play.google.com/store/apps/details?id=com.bloombyte.sudokan';
            
            // Universal link (same as current URL - will open app if installed)
            const universalLink = window.location.href;
            
            // Custom URL scheme fallback (optional)
            const customSchemeUrl = 'sudokan:/' + path;
            
            // Function to show store buttons
            function showStoreButtons() {
                document.getElementById('loading').classList.add('hidden');
                document.getElementById('store-redirect').classList.remove('hidden');
                
                // Hide irrelevant store button
                if (isIOS) {
                    document.getElementById('android-button').style.display = 'none';
                } else if (isAndroid) {
                    document.getElementById('ios-button').style.display = 'none';
                }
            }
            
            // Function to redirect to store
            function redirectToStore() {
                if (isIOS) {
                    window.location.href = appStoreUrl;
                } else if (isAndroid) {
                    window.location.href = playStoreUrl;
                } else {
                    // Desktop - show both options
                    showStoreButtons();
                }
            }
            
            // Try to open app via Universal/App Links
            // The page itself IS the universal link, so if app is installed,
            // iOS/Android will intercept and open the app.
            // If not, we're seeing this page and should redirect.
            
            // Check if we should auto-redirect (after a brief delay)
            // This handles the case where Universal Links didn't intercept
            let redirectTimeout = setTimeout(function() {
                showStoreButtons();
                
                // Auto-redirect to store after showing buttons briefly
                setTimeout(redirectToStore, 2000);
            }, 1500);
            
            // If the page becomes hidden (app opened), clear timeout
            document.addEventListener('visibilitychange', function() {
                if (document.hidden) {
                    clearTimeout(redirectTimeout);
                }
            });
            
            // Also try custom URL scheme for older devices
            if (isIOS || isAndroid) {
                // Create invisible iframe to try custom scheme
                const iframe = document.createElement('iframe');
                iframe.style.display = 'none';
                iframe.src = customSchemeUrl;
                document.body.appendChild(iframe);
                
                // Clean up iframe after attempt
                setTimeout(function() {
                    document.body.removeChild(iframe);
                }, 100);
            }
        })();
    </script>
</body>
</html>
